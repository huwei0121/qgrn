name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install solver and analysis dependencies
        run: python -m pip install -e ".[dev,plots]"
      - name: Check solver and benchmark contracts
        run: python -m pytest -q
      - name: Verify reference data and file checksums
        run: python reproduction/reproduce.py verify
      - name: Redraw reference figures
        run: python reproduction/reproduce.py plot --output outputs/reference
      - name: Check the Python optimization interface
        run: python reproduction/reproduce.py run --problems jandura_cz --methods qgrn bfgs --seeds 85201 --seconds 0.2 --output outputs/cz_smoke
      - name: Build and inspect the solver distributions
        run: |
          python -m build
          python tools/check_distribution.py dist
