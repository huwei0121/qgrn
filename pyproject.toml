[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgrn"
version = "0.1.0"
description = "Structured gradient-regularized Newton optimization for quantum control trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["quantum-control", "trajectory-optimization", "gauss-newton", "sparse-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.urls]
Repository = "https://github.com/huwei0121/qgrn"
Documentation = "https://github.com/huwei0121/qgrn/tree/v0.1.0/docs"
Issues = "https://github.com/huwei0121/qgrn/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1"]
plots = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qgrn", "qgrn.*"]
namespaces = false

[tool.setuptools.package-data]
qgrn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_qgrn*.py"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/qgrn/**/*.py", "src/qgrn_benchmarks/**/*.py", "tests/test_qgrn*.py", "examples/qgrn*.py", "tools/check_distribution.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
